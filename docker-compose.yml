name: one-postgres-ha

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_HA_IMAGE:-one-postgres-ha:pg18.6-patroni4.1.5}
    build:
      context: ./images/postgres
      provenance: disabled=true
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650}
    network_mode: host
    user: "999:999"
    group_add: ["${WATCHDOG_GID:-999}"]
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: ${POSTGRES_MEMORY_MB:-1536}m
    shm_size: 256m
    environment:
      PATRONI_CONFIG_FILE: /etc/one-postgres-ha/patroni.yml
      PGDATA: /var/lib/postgresql/data
      PATRONI_HEALTHCHECK_URL: http://127.0.0.1:8008/liveness
    volumes:
      - type: bind
        source: ${CONFIG_DIR:-./.local/node/config}
        target: /etc/one-postgres-ha
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECRETS_DIR:-./.local/node/secrets}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PG_DATA_DIR:-./.local/node/data/postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=999,gid=999,mode=1770
      - /run/postgresql:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=0770
      - /run/patroni:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=0700
    devices:
      - ${WATCHDOG_DEVICE:-/dev/watchdog}:/dev/watchdog:rw
    healthcheck:
      test: [CMD, /usr/local/bin/patroni-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging: *logging

  etcd:
    profiles: [core]
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.6.15@sha256:7cf6622cb09b111289eed8a0cce3478e4f01d5048b0e0a1ed208299f3419334d}
    entrypoint: [/usr/local/bin/etcd]
    command: [--config-file=/etc/one-postgres-ha/etcd.yml]
    network_mode: host
    user: "65532:65532"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: ${ETCD_MEMORY_MB:-256}m
    volumes:
      - type: bind
        source: ${CONFIG_DIR:-./.local/node/config}
        target: /etc/one-postgres-ha
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECRETS_DIR:-./.local/node/secrets}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ETCD_DATA_DIR:-./.local/node/data/etcd}
        target: /etcd-data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - --endpoints=https://${NODE_IP:-127.0.0.1}:2379
        - --cacert=/run/secrets/ca.crt
        - --cert=/run/secrets/etcd.crt
        - --key=/run/secrets/etcd.key
        - endpoint
        - health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  haproxy:
    profiles: [core]
    image: ${HAPROXY_IMAGE:-haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be}
    command: [haproxy, -W, -db, -f, /etc/one-postgres-ha/haproxy.cfg]
    network_mode: host
    user: "99:99"
    restart: unless-stopped
    stop_signal: SIGUSR1
    stop_grace_period: 120s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 64m
    volumes:
      - type: bind
        source: ${CONFIG_DIR:-./.local/node/config}
        target: /etc/one-postgres-ha
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/haproxy:rw,noexec,nosuid,size=4m,uid=99,gid=99,mode=0750
    healthcheck:
      test: [CMD, haproxy, -c, -f, /etc/one-postgres-ha/haproxy.cfg]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
