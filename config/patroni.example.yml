# Reference only: Ansible renders the actual per-node file from private inventory.
# Passwords are loaded by the image entrypoint from /run/secrets; never put them here.
scope: example-pg17
namespace: /one-postgres-ha/
name: node-01

restapi:
  listen: 0.0.0.0:8008
  connect_address: 192.0.2.11:8008
  authentication:
    username: admin
  allowlist: [127.0.0.1/32, 192.0.2.0/24]
  allowlist_include_members: true
ctl:
  authentication:
    username: admin

etcd3:
  hosts: 192.0.2.11:2379,192.0.2.12:2379,192.0.2.13:2379
  protocol: https
  cacert: /run/secrets/ca.crt
  cert: /run/secrets/patroni.crt
  key: /run/secrets/patroni.key

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576
    check_timeline: true
    synchronous_mode: true
    synchronous_mode_strict: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        shared_buffers: 256MB
        work_mem: 4MB
        maintenance_work_mem: 64MB
        max_connections: 100
        synchronous_commit: "on"
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 512MB
        max_slot_wal_keep_size: 2GB
        password_encryption: scram-sha-256
  initdb:
    - encoding: UTF8
    - data-checksums
    - auth-local: scram-sha-256
    - auth-host: scram-sha-256

postgresql:
  listen: 127.0.0.1,192.0.2.11:5433
  connect_address: 192.0.2.11:5433
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /run/patroni/pgpass
  authentication:
    superuser:
      username: postgres
    replication:
      username: replicator
    rewind:
      username: rewind_user
  parameters:
    unix_socket_directories: /run/postgresql
    logging_collector: "off"
  pg_hba:
    - local all all scram-sha-256
    - host all all 127.0.0.1/32 scram-sha-256
    - host replication replicator 127.0.0.1/32 scram-sha-256
    - host replication replicator 192.0.2.11/32 scram-sha-256
    - host replication replicator 192.0.2.12/32 scram-sha-256
    - host replication replicator 192.0.2.13/32 scram-sha-256
    - host all rewind_user 192.0.2.11/32 scram-sha-256
    - host all rewind_user 192.0.2.12/32 scram-sha-256
    - host all rewind_user 192.0.2.13/32 scram-sha-256
    - host all all 198.51.100.0/24 scram-sha-256
    - host all all 192.0.2.11/32 scram-sha-256
    - host all all 192.0.2.12/32 scram-sha-256
    - host all all 192.0.2.13/32 scram-sha-256
  basebackup:
    max-rate: 20M
    checkpoint: spread
  use_pg_rewind: true
  remove_data_directory_on_rewind_failure: false
  remove_data_directory_on_diverged_timelines: false

watchdog:
  mode: required
  device: /dev/watchdog
  safety_margin: -1
tags:
  nofailover: false
  nosync: false
  clonefrom: false
