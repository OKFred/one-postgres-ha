global
    log stdout format raw local0
    maxconn 300
    stats socket /run/haproxy/admin.sock mode 600 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s

frontend postgres_write
    bind 0.0.0.0:5432
    default_backend postgres_primary

backend postgres_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server node-01 192.0.2.11:5433 check port 8008
    server node-02 192.0.2.12:5433 check port 8008
    server node-03 192.0.2.13:5433 check port 8008

frontend local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /ready
    monitor fail if { nbsrv(postgres_primary) lt 1 }
