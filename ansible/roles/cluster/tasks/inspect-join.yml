- name: Require a healthy quorum
  ansible.builtin.include_tasks: etcd-health.yml

- name: Discover the existing leader
  ansible.builtin.include_tasks: read-cluster.yml

- name: Read primary identity and replication capacities
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - .env
      - exec
      - -T
      - postgres
      - /usr/local/bin/pg-admin
      - psql
      - -X
      - -A
      - -t
      - -d
      - postgres
      - -c
      - >-
        SELECT json_build_object('system_identifier',(SELECT system_identifier::text FROM pg_control_system()),
        'slots',current_setting('max_replication_slots')::int,'senders',current_setting('max_wal_senders')::int,
        'database_bytes',(SELECT sum(pg_database_size(oid)) FROM pg_database),
        'sync_count',(SELECT count(*) FROM pg_stat_replication WHERE state='streaming' AND sync_state='sync'));
    chdir: "{{ deployment_root }}"
  delegate_to: "{{ pg_ha_leader_host }}"
  register: pg_ha_join_source
  changed_when: false

- name: Require spare replication capacity without changing live PostgreSQL settings
  ansible.builtin.assert:
    that:
      - (pg_ha_join_source.stdout | from_json).slots | int >= groups.pg_nodes | length + 1
      - (pg_ha_join_source.stdout | from_json).senders | int >= groups.pg_nodes | length + 2
      - (pg_ha_join_source.stdout | from_json).sync_count | int >= 1
      - >-
        hostvars[add_node].pg_ha_disk_free.stdout_lines[-1] | trim | int >=
        ((pg_ha_join_source.stdout | from_json).database_bytes | int * 1.3)
        + minimum_data_free_gib | int * 1073741824
    fail_msg: Replication capacity, synchronous availability, or destination disk headroom is insufficient.

- name: Remember the source identity and matching member
  ansible.builtin.set_fact:
    pg_ha_join_identity: "{{ (pg_ha_join_source.stdout | from_json).system_identifier }}"
    pg_ha_join_member: "{{ pg_ha_cluster_response.json.members | selectattr('name', 'equalto', add_node) | first | default({}) }}"

- name: Detect a previously completed addition
  ansible.builtin.set_fact:
    pg_ha_join_already_accepted: >-
      {{ pg_ha_join_member | length > 0
      and not (pg_ha_join_member.tags.nofailover | default(false))
      and not (pg_ha_join_member.tags.nosync | default(false)) }}

- name: Inspect the new node's pending marker
  ansible.builtin.stat:
    path: "{{ hostvars[add_node].data_root }}/.one-postgres-ha-join-pending"
  delegate_to: "{{ add_node }}"
  register: pg_ha_join_pending

- name: Do not reinterpret an existing cluster member as a new replica
  ansible.builtin.assert:
    that:
      - >-
        pg_ha_cluster_response.json.members | selectattr('name', 'equalto', add_node)
        | list | length == 0 or pg_ha_join_pending.stat.exists or pg_ha_join_already_accepted

- name: Report a previously completed addition
  ansible.builtin.debug:
    msg: "{{ add_node }} is already an accepted member; add-node will leave it unchanged."
  when: pg_ha_join_already_accepted
