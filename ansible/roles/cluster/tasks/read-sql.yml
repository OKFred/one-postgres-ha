- name: Read database identity and replication state
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - .env
      - exec
      - -T
      - postgres
      - /usr/local/bin/pg-admin
      - psql
      - -X
      - -A
      - -t
      - -d
      - postgres
      - -c
      - >-
        SELECT json_build_object(
        'system_identifier',(SELECT system_identifier::text FROM pg_control_system()),
        'in_recovery',pg_is_in_recovery(),
        'server_version_num',current_setting('server_version_num'),
        'data_checksums',current_setting('data_checksums'),
        'synchronous_commit',current_setting('synchronous_commit'),
        'synchronous_standby_names',current_setting('synchronous_standby_names'),
        'max_replication_slots',current_setting('max_replication_slots'),
        'max_wal_senders',current_setting('max_wal_senders'),
        'replay_lsn',pg_last_wal_replay_lsn()::text,
        'replication',COALESCE((SELECT json_agg(json_build_object(
        'application_name',application_name,'state',state,'sync_state',sync_state,
        'replay_lsn',replay_lsn::text)) FROM pg_stat_replication),'[]'::json));
    chdir: "{{ deployment_root }}"
  register: pg_ha_sql_result
  changed_when: false

- name: Parse database status
  ansible.builtin.set_fact:
    pg_ha_sql: "{{ pg_ha_sql_result.stdout | from_json }}"
