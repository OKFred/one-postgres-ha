- name: Prepare and reload the existing proxy
  when:
    - not hostvars[groups.core_nodes[0]].pg_ha_join_already_accepted
    - not add_node_plan | default(false) | bool
  block:
    - name: Render all replica candidates
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: "{{ deployment_root }}/config/haproxy.next.cfg"
        owner: root
        group: root
        mode: '0644'
    - name: Validate before signalling the running proxy
      ansible.builtin.command:
        argv: [docker, compose, --env-file, .env, exec, -T, haproxy, haproxy, -c, -f, /etc/one-postgres-ha/haproxy.next.cfg]
        chdir: "{{ deployment_root }}"
      changed_when: false
    - name: Publish only the validated proxy configuration
      ansible.builtin.copy:
        remote_src: true
        src: "{{ deployment_root }}/config/haproxy.next.cfg"
        dest: "{{ deployment_root }}/config/haproxy.cfg"
        owner: root
        group: root
        mode: '0644'
    - name: Reload the HAProxy master without dropping established sessions
      ansible.builtin.command:
        argv: [docker, compose, --env-file, .env, kill, --signal, SIGUSR2, haproxy]
        chdir: "{{ deployment_root }}"
      changed_when: true
    - name: Verify the reloaded proxy still has an available primary
      ansible.builtin.uri:
        url: http://127.0.0.1:8404/ready
        status_code: 200
      register: pg_ha_reloaded_proxy
      retries: 30
      delay: 2
      until: pg_ha_reloaded_proxy.status | default(0) == 200
