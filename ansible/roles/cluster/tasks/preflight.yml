- name: Validate application image configuration before inspecting hosts
  ansible.builtin.include_tasks: validate-image.yml

- name: Validate inventory invariants
  ansible.builtin.assert:
    that:
      - groups.core_nodes | length == 3
      - groups.pg_nodes | length >= 3
      - groups.core_nodes | difference(groups.pg_nodes) | length == 0
      - postgres_port | int == 5433
      - patroni_port | int == 8008
      - cluster_name is match('^[a-z][a-z0-9-]{2,48}$')
      - node_name is match('^[a-z][a-z0-9-]{1,48}$')
      - node_name == inventory_hostname
      - node_ip is defined
      - node_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - node_ip.split('.') | map('int') | max <= 255
      - network_interface is defined
      - vip_address is defined
      - vip_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - vip_address.split('.') | map('int') | max <= 255
      - vip_prefix | int > 0
      - vip_prefix | int <= 32
      - vip_router_id | int > 0
      - vip_router_id | int < 256
      - admin_cidrs | default([]) | length > 0
      - client_cidrs | default([]) | length > 0
      - vip_reserved | default(false) | bool
      - ansible_facts.system == 'Linux'
      - deployment_root is match('^/[A-Za-z0-9_./-]+$')
      - deployment_root not in ['/', '/etc', '/var', '/opt', '/srv', '/home', '/usr']
      - data_mount is match('^/[A-Za-z0-9_./-]+$')
      - data_mount not in ['/', '/var', '/tmp']
      - data_root is match('^/[A-Za-z0-9_./-]+$')
      - data_root.startswith(data_mount.rstrip('/') + '/')
    fail_msg: Invalid inventory, architecture, or unsafe storage path.

- name: Require supported uniform node architecture
  ansible.builtin.assert:
    that:
      - expected_architecture in ['aarch64', 'x86_64']
      - ansible_facts.architecture == expected_architecture
      - groups.pg_nodes | map('extract', hostvars, ['ansible_facts', 'architecture']) | unique | list == [expected_architecture]
    fail_msg: All PostgreSQL nodes must match expected_architecture (aarch64 or x86_64); mixed or unknown architectures are unsupported.

- name: Validate allowlist CIDRs before rendering host firewall rules
  ansible.builtin.assert:
    that:
      - item is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$')
      - item.split('/')[0].split('.') | map('int') | max <= 255
  loop: "{{ admin_cidrs + client_cidrs }}"

- name: Ensure member identifiers and addresses are unique
  ansible.builtin.assert:
    that:
      - groups.pg_nodes | map('extract', hostvars, 'node_name') | unique | length == groups.pg_nodes | length
      - groups.pg_nodes | map('extract', hostvars, 'node_ip') | unique | length == groups.pg_nodes | length
  run_once: true

- name: Inspect the deployment directory
  ansible.builtin.stat:
    path: "{{ deployment_root }}"
    follow: false
  register: pg_ha_deployment_stat

- name: Inspect the deployment identity marker
  ansible.builtin.stat:
    path: "{{ deployment_root }}/.one-postgres-ha-cluster"
    follow: false
  register: pg_ha_deployment_marker

- name: Reject a linked or non-directory deployment root
  ansible.builtin.assert:
    that:
      - not pg_ha_deployment_stat.stat.exists or pg_ha_deployment_stat.stat.isdir
      - not pg_ha_deployment_stat.stat.islnk | default(false)
      - not pg_ha_deployment_marker.stat.islnk | default(false)

- name: List existing deployment files
  ansible.builtin.find:
    paths: "{{ deployment_root }}"
    hidden: true
    recurse: false
    file_type: any
  register: pg_ha_existing_deployment_files
  when: pg_ha_deployment_stat.stat.exists

- name: Reject unknown nonempty deployment directories
  ansible.builtin.assert:
    that: pg_ha_deployment_marker.stat.exists or pg_ha_existing_deployment_files.matched | default(0) == 0
    fail_msg: Deployment root contains another application's files and will not be adopted.

- name: Read the deployment identity
  ansible.builtin.slurp:
    src: "{{ deployment_root }}/.one-postgres-ha-cluster"
  register: pg_ha_deployment_marker_content
  when: pg_ha_deployment_marker.stat.exists

- name: Require the expected deployment identity
  ansible.builtin.assert:
    that: pg_ha_deployment_marker_content.content | b64decode | trim == cluster_name
  when: pg_ha_deployment_marker.stat.exists

- name: Inspect the exact SSD mount
  ansible.builtin.command:
    argv: [findmnt, --json, --mountpoint, "{{ data_mount }}"]
  register: pg_ha_mount
  changed_when: false

- name: Validate a writable local block-device filesystem
  ansible.builtin.assert:
    that:
      - (pg_ha_mount.stdout | from_json).filesystems | length == 1
      - (pg_ha_mount.stdout | from_json).filesystems[0].target == data_mount
      - (pg_ha_mount.stdout | from_json).filesystems[0].source is match('^/dev/')
      - (pg_ha_mount.stdout | from_json).filesystems[0].fstype in ['ext4', 'xfs', 'btrfs']
      - "'rw' in (pg_ha_mount.stdout | from_json).filesystems[0].options.split(',')"
    fail_msg: The data mount must already exist on a writable local SSD; no disk is formatted automatically.

- name: Inspect the block-device rotation flag
  ansible.builtin.command:
    argv: [lsblk, --noheadings, --nodeps, --output, ROTA, "{{ (pg_ha_mount.stdout | from_json).filesystems[0].source.split('[')[0] }}"]
  register: pg_ha_rotation
  changed_when: false

- name: Require non-rotating storage
  ansible.builtin.assert:
    that: pg_ha_rotation.stdout | trim == '0'

- name: Resolve the data path without creating it
  ansible.builtin.command:
    argv: [realpath, --canonicalize-missing, "{{ data_root }}"]
  register: pg_ha_canonical_data
  changed_when: false

- name: Reject symlink escapes
  ansible.builtin.assert:
    that: pg_ha_canonical_data.stdout == data_root

- name: Inspect existing data ownership marker
  ansible.builtin.stat:
    path: "{{ data_root }}/.one-postgres-ha-cluster"
    follow: false
  register: pg_ha_marker

- name: Inspect the unfinished replica-addition marker
  ansible.builtin.stat:
    path: "{{ data_root }}/.one-postgres-ha-join-pending"
    follow: false
  register: pg_ha_pending_marker

- name: Inspect the data directory
  ansible.builtin.stat:
    path: "{{ data_root }}"
    follow: false
  register: pg_ha_data_stat

- name: Reject non-directory or linked storage
  ansible.builtin.assert:
    that:
      - not pg_ha_data_stat.stat.exists or pg_ha_data_stat.stat.isdir
      - not pg_ha_data_stat.stat.islnk | default(false)
      - not pg_ha_marker.stat.islnk | default(false)

- name: List immediate children without changing them
  ansible.builtin.find:
    paths: "{{ data_root }}"
    recurse: false
    hidden: true
    file_type: any
  register: pg_ha_data_children
  when: pg_ha_data_stat.stat.exists

- name: Reject unknown nonempty data
  ansible.builtin.assert:
    that: pg_ha_marker.stat.exists or pg_ha_data_children.matched | default(0) == 0
    fail_msg: Nonempty storage has no ownership marker; inspect it manually. The deployment will not remove or adopt it.

- name: Read existing marker
  ansible.builtin.slurp:
    src: "{{ data_root }}/.one-postgres-ha-cluster"
  register: pg_ha_marker_content
  when: pg_ha_marker.stat.exists

- name: Validate the existing cluster identity
  ansible.builtin.assert:
    that: pg_ha_marker_content.content | b64decode | trim == cluster_name
  when: pg_ha_marker.stat.exists

- name: Inspect the PostgreSQL directory without following links
  ansible.builtin.stat:
    path: "{{ data_root }}/postgres"
    follow: false
  register: pg_ha_pgdata_stat

- name: Require an unlinked PostgreSQL directory before reading its major version
  ansible.builtin.assert:
    that:
      - not pg_ha_pgdata_stat.stat.exists or pg_ha_pgdata_stat.stat.isdir
      - not pg_ha_pgdata_stat.stat.islnk | default(false)
    fail_msg: PostgreSQL storage must be a real directory; no linked data path is adopted.

- name: Inspect the PostgreSQL major version without following links
  ansible.builtin.stat:
    path: "{{ data_root }}/postgres/PG_VERSION"
    follow: false
  register: pg_ha_pg_version_stat

- name: Require a protected ordinary PostgreSQL version file
  ansible.builtin.assert:
    that:
      - not pg_ha_pg_version_stat.stat.exists or pg_ha_pg_version_stat.stat.isreg
      - not pg_ha_pg_version_stat.stat.islnk | default(false)
      - not pg_ha_pg_version_stat.stat.exists or pg_ha_pg_version_stat.stat.uid == postgres_uid | int
      - not pg_ha_pg_version_stat.stat.exists or pg_ha_pg_version_stat.stat.nlink == 1
    fail_msg: PostgreSQL version metadata must be an ordinary owned file; preserve unsafe storage for inspection.

- name: Read the existing PostgreSQL major version without changing data
  ansible.builtin.slurp:
    src: "{{ data_root }}/postgres/PG_VERSION"
  register: pg_ha_pg_version_content
  when: pg_ha_pg_version_stat.stat.exists

- name: Refuse existing PostgreSQL data from another major version before deployment
  ansible.builtin.assert:
    that: pg_ha_pg_version_content.content | b64decode | trim == '17'
    fail_msg: >-
      This deployment supports PostgreSQL 17 data only. Existing PG18 or other-major data is preserved;
      no downgrade, migration or container reconciliation was attempted.
  when: pg_ha_pg_version_stat.stat.exists

- name: Inspect uninitialized PostgreSQL directories without creating them
  ansible.builtin.find:
    paths: "{{ data_root }}/postgres"
    recurse: false
    hidden: true
    file_type: any
    follow: false
  register: pg_ha_uninitialized_pg_children
  when:
    - pg_ha_pgdata_stat.stat.exists
    - not pg_ha_pg_version_stat.stat.exists

- name: Reject nonempty PostgreSQL data without trustworthy major-version metadata
  ansible.builtin.assert:
    that: pg_ha_uninitialized_pg_children.matched == 0
    fail_msg: Nonempty PostgreSQL storage has no PG_VERSION; preserve it for inspection before deployment.
  when:
    - pg_ha_pgdata_stat.stat.exists
    - not pg_ha_pg_version_stat.stat.exists

- name: Read available disk space
  ansible.builtin.command:
    argv: [df, -B1, --output=avail, "{{ data_mount }}"]
  register: pg_ha_disk_free
  changed_when: false

- name: Require storage headroom
  ansible.builtin.assert:
    that: pg_ha_disk_free.stdout_lines[-1] | trim | int >= minimum_data_free_gib | int * 1073741824

- name: Check the required tools
  ansible.builtin.shell: |
    for tool in docker ss fuser openssl iptables ip6tables flock curl \
      systemctl udevadm iptables-restore ip6tables-restore timeout; do
      command -v "$tool" >/dev/null || { printf 'Missing required tool: %s\n' "$tool" >&2; exit 1; }
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Check Docker and Compose
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  changed_when: false

- name: Inspect managed containers
  ansible.builtin.command:
    argv: [docker, ps, --quiet, --filter, "label=com.docker.compose.project={{ compose_project_name }}"]
  register: pg_ha_managed_containers
  changed_when: false

- name: Inspect PostgreSQL containers allowed to hold the watchdog
  ansible.builtin.command:
    argv: [docker, ps, --quiet, --filter, "label=com.docker.compose.project={{ compose_project_name }}", --filter, label=com.docker.compose.service=postgres]
  register: pg_ha_watchdog_containers
  changed_when: false

- name: Inspect listeners
  ansible.builtin.command:
    argv: [ss, --listening, --tcp, --numeric]
  register: pg_ha_listeners
  changed_when: false

- name: Reject occupied ports on unmanaged nodes
  ansible.builtin.assert:
    that:
      - pg_ha_managed_containers.stdout | trim | length > 0 or not pg_ha_listeners.stdout is search(':(5432|5433|8008|2379|2380)\s')
    fail_msg: A required port is occupied by an unmanaged service.

- name: Inspect all required TCP port holders
  ansible.builtin.command:
    argv: [fuser, -n, tcp, '5432', '5433', '8008', '2379', '2380', '8404']
  register: pg_ha_port_users
  failed_when: pg_ha_port_users.rc not in [0, 1]
  changed_when: false

- name: Read TCP port holder cgroups
  ansible.builtin.slurp:
    src: "/proc/{{ item }}/cgroup"
  loop: "{{ pg_ha_port_users.stdout.split() | unique }}"
  register: pg_ha_port_cgroups

- name: Refuse ports owned outside this Compose project
  ansible.builtin.assert:
    that: pg_ha_managed_containers.stdout_lines | select('in', item.content | b64decode) | list | length > 0
    fail_msg: A PostgreSQL HA port belongs to another host or container service.
  loop: "{{ pg_ha_port_cgroups.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect the watchdog device without opening it
  ansible.builtin.stat:
    path: "{{ watchdog_device }}"
    follow: true
  register: pg_ha_watchdog

- name: Require a real watchdog character device
  ansible.builtin.assert:
    that:
      - pg_ha_watchdog.stat.exists
      - pg_ha_watchdog.stat.ischr
    fail_msg: A hardware or kernel watchdog is required; this check never opens or arms it.

- name: Inspect current watchdog holders
  ansible.builtin.command:
    argv: [fuser, "{{ watchdog_device }}"]
  register: pg_ha_watchdog_users
  failed_when: pg_ha_watchdog_users.rc not in [0, 1]
  changed_when: false

- name: Inspect holder cgroups
  ansible.builtin.slurp:
    src: "/proc/{{ item }}/cgroup"
  loop: "{{ pg_ha_watchdog_users.stdout.split() }}"
  register: pg_ha_watchdog_cgroups

- name: Require exclusive ownership by this deployment
  ansible.builtin.assert:
    that:
      - pg_ha_watchdog_containers.stdout_lines | select('in', item.content | b64decode) | list | length > 0
    fail_msg: Another service holds the watchdog; it must be resolved manually before deployment.
  loop: "{{ pg_ha_watchdog_cgroups.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect systemd watchdog ownership settings
  ansible.builtin.command:
    argv: [systemctl, show, --property=RuntimeWatchdogUSec, --property=RebootWatchdogUSec]
  register: pg_ha_systemd_watchdog
  changed_when: false

- name: Reject active systemd runtime watchdog ownership
  ansible.builtin.assert:
    that: "'RuntimeWatchdogUSec=0' in pg_ha_systemd_watchdog.stdout_lines"

- name: Check private input files on the controller
  ansible.builtin.stat:
    path: "{{ private_dir }}/secrets/{{ item }}"
  delegate_to: localhost
  become: false
  loop:
    - postgres-password
    - replication-password
    - rewind-password
    - patroni-api-password
    - ca.crt
    - "{{ node_name }}/etcd.crt"
    - "{{ node_name }}/etcd.key"
    - "{{ node_name }}/patroni.crt"
    - "{{ node_name }}/patroni.key"
  register: pg_ha_private_inputs
  no_log: true

- name: Require complete private inputs
  ansible.builtin.assert:
    that: pg_ha_private_inputs.results | selectattr('stat.exists', 'equalto', false) | list | length == 0
    fail_msg: Required credentials or certificates are missing from the private secrets directory.
  no_log: true

- name: Verify the node TLS chains on the controller
  ansible.builtin.command:
    argv: [openssl, verify, -CAfile, "{{ private_dir }}/secrets/ca.crt", "{{ private_dir }}/secrets/{{ node_name }}/{{ item }}.crt"]
  loop: [etcd, patroni]
  delegate_to: localhost
  become: false
  changed_when: false

- name: Verify the etcd certificate IP addresses
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ private_dir }}/secrets/{{ node_name }}/etcd.crt", -noout, -checkip, "{{ item }}"]
  loop: ["{{ node_ip }}", 127.0.0.1]
  delegate_to: localhost
  become: false
  changed_when: false

- name: Inspect already-deployed credential files
  ansible.builtin.stat:
    path: "{{ deployment_root }}/secrets/{{ item }}"
  loop: [postgres-password, replication-password, rewind-password, patroni-api-password, ca.crt]
  register: pg_ha_current_credentials
  no_log: true

- name: Read deployed credentials only for change detection
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ pg_ha_current_credentials.results }}"
  when: item.stat.exists
  register: pg_ha_current_credential_data
  no_log: true

- name: Refuse implicit password or CA rotation during deployment
  ansible.builtin.assert:
    that:
      - item.content | b64decode | trim == lookup('ansible.builtin.file', private_dir + '/secrets/' + item.item.item) | trim
    fail_msg: A deployed credential or CA differs from the private input. Perform a separate planned rotation.
  loop: "{{ pg_ha_current_credential_data.results }}"
  when: item.content is defined
  no_log: true

- name: Require an explicit Keepalived package version for core nodes
  ansible.builtin.assert:
    that: keepalived_package_version | default('') | length > 0
    fail_msg: Set the exact Keepalived package version available from each host's package repository.
  when: inventory_hostname in groups.core_nodes

- name: Inspect any existing host Keepalived configuration
  ansible.builtin.stat:
    path: /etc/keepalived/keepalived.conf
  register: pg_ha_existing_keepalived
  when: inventory_hostname in groups.core_nodes

- name: Read existing Keepalived configuration without displaying it
  ansible.builtin.slurp:
    src: /etc/keepalived/keepalived.conf
  register: pg_ha_existing_keepalived_content
  when:
    - inventory_hostname in groups.core_nodes
    - pg_ha_existing_keepalived.stat.exists
  no_log: true

- name: Reject replacement of another Keepalived configuration
  ansible.builtin.assert:
    that:
      - not pg_ha_existing_keepalived.stat.exists or '# Managed by one-postgres-ha.' in pg_ha_existing_keepalived_content.content | default('') | b64decode
    fail_msg: Keepalived already has unmanaged configuration; adoption is not automatic.
  when: inventory_hostname in groups.core_nodes

- name: Read the node's assigned IPv4 addresses
  ansible.builtin.command:
    argv: [ip, -j, -4, address, show, dev, "{{ network_interface }}"]
  register: pg_ha_interface_addresses
  changed_when: false

- name: Require the configured peer address on this interface
  ansible.builtin.assert:
    that: node_ip in ((pg_ha_interface_addresses.stdout | from_json | first).addr_info | map(attribute='local') | list)

- name: Check peer routes and chosen source addresses
  ansible.builtin.command:
    argv: [ip, -j, -4, route, get, "{{ hostvars[item].node_ip }}"]
  loop: "{{ groups.core_nodes | difference([inventory_hostname]) }}"
  register: pg_ha_peer_routes
  changed_when: false

- name: Require the advertised source address and interface for every peer
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json | first).prefsrc | default((item.stdout | from_json | first).src | default('')) == node_ip
      - (item.stdout | from_json | first).dev | default('') == network_interface
    fail_msg: Peer routing must use the configured node_ip and network_interface; fix persistent route metrics before deployment or adding a replica.
  loop: "{{ pg_ha_peer_routes.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require core nodes on the same directly attached network
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json | first).gateway is not defined
    fail_msg: Core nodes must share the directly attached network used for the VIP.
  loop: "{{ pg_ha_peer_routes.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: inventory_hostname in groups.core_nodes

- name: Report completed preflight
  ansible.builtin.debug:
    msg:
      node: "{{ node_name }}"
      preflight: passed
      architecture: "{{ ansible_facts.architecture }}"
      mount: "{{ data_mount }}"
      watchdog: "{{ watchdog_device }}"
      excludes: [failure_exercises, backup_restore, application_acceptance]
