- name: Start this initial PostgreSQL member
  ansible.builtin.command:
    argv: [docker, compose, --env-file, .env, up, -d, --no-build, postgres]
    chdir: "{{ deployment_root }}"
  when: hostvars[groups.core_nodes[0]].pg_ha_new_cluster
  changed_when: true

- name: Wait for the initial replica to enter recovery
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ patroni_port }}/replica"
    status_code: 200
  register: pg_ha_initial_replica
  until: pg_ha_initial_replica.status | default(0) == 200
  retries: "{{ (join_timeout | int / 5) | int }}"
  delay: 5
  when:
    - hostvars[groups.core_nodes[0]].pg_ha_new_cluster
    - inventory_hostname != groups.core_nodes[0]
