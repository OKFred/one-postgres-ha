---
- name: Install independent backup and restore rehearsal timers
  hosts: backup_server
  become: true
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir | dirname | dirname }}"
    private_dir: "{{ project_root }}/.local"
    deployment_root: /opt/one-postgres-ha
  tasks:
    - name: Configure timers when the independent target is enabled
      when: backup_target.enabled | default(false) | bool
      block:
        - name: Prepare backup tooling
          ansible.builtin.include_tasks: prepare.yml

        - name: Install data service units
          ansible.builtin.template:
            src: data.service.j2
            dest: "/etc/systemd/system/one-postgres-ha-{{ item }}.service"
            owner: root
            group: root
            mode: '0644'
          loop: [backup, restore-test]

        - name: Install data timer units
          ansible.builtin.template:
            src: data.timer.j2
            dest: "/etc/systemd/system/one-postgres-ha-{{ item }}.timer"
            owner: root
            group: root
            mode: '0644'
          loop: [backup, restore-test]

        - name: Enable daily backup and weekly isolated restore
          ansible.builtin.systemd_service:
            name: "one-postgres-ha-{{ item }}.timer"
            enabled: true
            state: started
            daemon_reload: true
          loop: [backup, restore-test]
