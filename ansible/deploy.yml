- name: Check every node before changing the deployment
  ansible.builtin.import_playbook: preflight.yml

- name: Inspect whether this is an initial cluster start
  hosts: core_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: inspect-start
  roles: [cluster]

- name: Refuse unfinished joins and unsafe new members before changing any node
  hosts: pg_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Established databases require the isolated add-node operation for new replicas
      ansible.builtin.assert:
        that: >-
          inventory_hostname in groups.core_nodes or pg_ha_marker.stat.exists or
          groups.pg_nodes | map('extract', hostvars, 'pg_ha_pg_version_stat')
          | selectattr('stat.exists', 'equalto', true) | list | length == 0
        fail_msg: An initialized cluster cannot enroll a fresh replica through deploy. Use add-node for this host.
    - name: Pending additions must be completed with add-node
      ansible.builtin.assert:
        that: not pg_ha_pending_marker.stat.exists
        fail_msg: A replica addition is pending; use add-node to finish it safely.

- name: Prepare the etcd and proxy cohort before inspecting DCS
  hosts: core_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: prepare
  roles: [cluster]
  post_tasks:
    - name: Prepare the configured application image
      ansible.builtin.include_role:
        name: cluster
        tasks_from: prepare-image
    - name: Inspect whether PostgreSQL container reconciliation is needed
      ansible.builtin.include_role:
        name: cluster
        tasks_from: inspect-update

- name: Start every selected initial etcd member before waiting for quorum
  hosts: core_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Start initial etcd without a per-host health wait
      ansible.builtin.command:
        argv: [docker, compose, --env-file, .env, up, -d, --no-build, etcd]
        chdir: "{{ deployment_root }}"
      when: hostvars[groups.core_nodes[0]].pg_ha_initial_etcd_start
      changed_when: true

- name: Update existing etcd members sequentially
  hosts: core_nodes
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: update-etcd
  roles: [cluster]

- name: Require etcd quorum and inspect the existing initialization key
  hosts: core_nodes[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: inspect-dcs
  roles: [cluster]

- name: Prepare approved replicas after the DCS initialization decision
  hosts: pg_nodes:!core_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: prepare
  pre_tasks:
    - name: Fresh replicas are allowed only for an uninitialized PostgreSQL cluster
      ansible.builtin.assert:
        that: hostvars[groups.core_nodes[0]].pg_ha_new_cluster or pg_ha_marker.stat.exists
        fail_msg: Deploy does not enroll new replicas into an initialized DCS. Use add-node for this host.
  roles: [cluster]
  post_tasks:
    - name: Prepare the configured replica application image
      ansible.builtin.include_role:
        name: cluster
        tasks_from: prepare-image
    - name: Inspect replica image and configuration reconciliation
      ansible.builtin.include_role:
        name: cluster
        tasks_from: inspect-update

- name: Inspect retained-data receipts on every PostgreSQL member
  hosts: pg_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: inspect-retained
  roles: [cluster]

- name: Validate the complete controlled recovery before starting any member
  hosts: core_nodes[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: classify-retained
  roles: [cluster]

- name: Record recoverable startup intent on all retained members
  hosts: pg_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: advance-retained
    pg_ha_retained_operation: mark
  roles: [cluster]

- name: Start all validated retained PostgreSQL members without altering DCS
  hosts: pg_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Start this controlled existing-data recovery member
      ansible.builtin.command:
        argv: [docker, compose, --env-file, .env, up, -d, --no-build, postgres]
        chdir: "{{ deployment_root }}"
      changed_when: true
      when: hostvars[groups.core_nodes[0]].pg_ha_retained_restore_required

- name: Require a unique leader after retained PostgreSQL recovery
  hosts: core_nodes[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Wait for the first core API and exactly one established leader
      ansible.builtin.uri:
        url: "http://{{ node_ip }}:{{ patroni_port }}/cluster"
        return_content: true
        status_code: 200
      register: pg_ha_restored_cluster
      until: >-
        pg_ha_restored_cluster.status | default(0) == 200 and
        (pg_ha_restored_cluster.json | default({})).members | default([])
        | selectattr('role', 'equalto', 'leader') | list | length == 1
      retries: 120
      delay: 2
      when: pg_ha_retained_restore_required

- name: Confirm restored member health before existing rolling checks
  hosts: pg_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Wait for this restored PostgreSQL process to become healthy
      ansible.builtin.uri:
        url: "http://{{ node_ip }}:{{ patroni_port }}/health"
        status_code: 200
      register: pg_ha_restored_member
      until: pg_ha_restored_member.status | default(0) == 200
      retries: 120
      delay: 2
      when: hostvars[groups.core_nodes[0]].pg_ha_retained_restore_required
    - name: Remember the rendered configuration was consumed by recovered containers
      ansible.builtin.set_fact:
        pg_ha_patroni_template: "{{ pg_ha_patroni_template | combine({'changed': false}) }}"
      when: hostvars[groups.core_nodes[0]].pg_ha_retained_restore_required
    - name: Refresh image and configuration identity after controlled recovery
      ansible.builtin.include_role:
        name: cluster
        tasks_from: inspect-update
      when: hostvars[groups.core_nodes[0]].pg_ha_retained_restore_required

- name: Bootstrap exactly one PostgreSQL primary
  hosts: core_nodes[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: start-postgres
  roles: [cluster]
  tasks:
    - name: Wait for the first primary role, not a synchronous SQL write
      ansible.builtin.uri:
        url: "http://{{ node_ip }}:{{ patroni_port }}/primary"
        status_code: 200
      register: pg_ha_first_primary
      until: pg_ha_first_primary.status | default(0) == 200
      retries: 120
      delay: 2
      when: pg_ha_new_cluster

- name: Build every initial standby after primary bootstrap
  hosts: "pg_nodes:!{{ groups.get('core_nodes', ['__missing_core__'])[0] }}"
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: start-postgres
  roles: [cluster]

- name: Discover the current leader after replicas are available
  hosts: core_nodes[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: read-cluster
  roles: [cluster]

- name: Update existing replicas one at a time
  hosts: pg_nodes
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: update-replica
  roles: [cluster]

- name: Switch the leader before updating the former primary
  hosts: core_nodes[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: update-primary
  roles: [cluster]

- name: Start the existing proxies and host VIP services
  hosts: core_nodes
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: start-proxy
  roles: [cluster]

- name: Check the running cluster invariants
  ansible.builtin.import_playbook: verify.yml
- name: Complete controlled recovery receipts only after full verification
  hosts: pg_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cluster_action: advance-retained
    pg_ha_retained_operation: complete
  roles: [cluster]
- name: Install scheduled backup and restore tests
  ansible.builtin.import_playbook: data/install-timers.yml
